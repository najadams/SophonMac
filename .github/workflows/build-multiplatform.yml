name: Build Multi-Platform Electron App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      BUNDLED_NODE_VERSION: '20.18.1'
    
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
        
    - name: Install root dependencies
      run: pnpm install
      
    - name: Install frontend dependencies
      run: |
        cd frontend
        pnpm install
        
    - name: Install backend dependencies
      run: |
        cd backend
        pnpm install --production
        
    - name: Build frontend
      run: |
        cd frontend
        pnpm run build

    - name: Stage Windows Node runtime (only on Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $Version = "${{ env.BUNDLED_NODE_VERSION }}"
        $ZipUrl = "https://nodejs.org/dist/v$Version/node-v$Version-win-x64.zip"
        Write-Host "Downloading Node runtime from $ZipUrl"
        Invoke-WebRequest -Uri $ZipUrl -OutFile node-win-x64.zip
        Expand-Archive -Path node-win-x64.zip -DestinationPath node-win-x64 -Force
        New-Item -ItemType Directory -Force -Path resources/runtime/node-win-x64 | Out-Null
        Copy-Item -Path "node-win-x64/node-v$Version-win-x64/node.exe" -Destination "resources/runtime/node-win-x64/node.exe" -Force
        Write-Host "Staged node.exe to resources/runtime/node-win-x64/node.exe"
        
    - name: Ensure backend node_modules are properly installed
      run: |
        cd backend
        pnpm install --production
        
    - name: Build/release Electron app
      run: |
        pnpm run prebuild
        npx electron-builder --publish=never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BUNDLED_NODE_VERSION: ${{ env.BUNDLED_NODE_VERSION }}
        VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        
    - name: Upload build artifacts
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-build
        path: |
          dist/
        retention-days: 30