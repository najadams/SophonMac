name: Build Windows Electron App (Packager)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'main.js'
      - 'package.json'

jobs:
  build-windows-packager:
    runs-on: windows-latest
    env:
      BUNDLED_NODE_VERSION: '22.11.0'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
        
    - name: Install root dependencies
      run: pnpm install
      
    - name: Install frontend dependencies
      run: |
        cd frontend
        pnpm install
        
    - name: Install backend dependencies
      run: |
        cd backend
        pnpm install --production
        
    - name: Build frontend
      run: |
        cd frontend
        pnpm run build

    - name: Stage Windows Node runtime (Node ${{ env.BUNDLED_NODE_VERSION }})
      shell: pwsh
      run: |
        $Version = "${{ env.BUNDLED_NODE_VERSION }}"
        $ZipUrl = "https://nodejs.org/dist/v$Version/node-v$Version-win-x64.zip"
        Write-Host "Downloading Node runtime from $ZipUrl"
        Invoke-WebRequest -Uri $ZipUrl -OutFile node-win-x64.zip
        Expand-Archive -Path node-win-x64.zip -DestinationPath node-win-x64 -Force
        New-Item -ItemType Directory -Force -Path resources/runtime/node-win-x64 | Out-Null
        Copy-Item -Path "node-win-x64/node-v$Version-win-x64/node.exe" -Destination "resources/runtime/node-win-x64/node.exe" -Force
        Write-Host "Staged node.exe to resources/runtime/node-win-x64/node.exe"
        
    - name: Package Windows app with electron-packager
      run: pnpm run package:win
      env:
        BUNDLED_NODE_VERSION: ${{ env.BUNDLED_NODE_VERSION }}
      
    - name: Create zip archive
      run: |
        cd dist/win
        $folderName = Get-ChildItem -Directory | Select-Object -First 1 -ExpandProperty Name
        Compress-Archive -Path $folderName -DestinationPath "sophon-windows-portable.zip"
        
    - name: Upload Windows packaged artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-packaged-build
        path: |
          dist/win/*.zip
          dist/win/*/
        retention-days: 30
        
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/win/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}